server {
    listen 80;
    server_name app.asd-kontur.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.asd-kontur.ru;

    ssl_certificate /etc/letsencrypt/live/app.asd-kontur.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asd-kontur.ru/privkey.pem;

    client_max_body_size 512m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://172.18.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location / {
        proxy_pass http://172.18.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /503.html;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"detail":"authoritative_primary_unavailable"}';
    }

    location = /503.html {
        internal;
        root /var/www/asd-kontur-unavailable;
    }
}
