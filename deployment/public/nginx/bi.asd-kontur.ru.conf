server {
    listen 80;
    server_name bi.asd-kontur.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bi.asd-kontur.ru;

    ssl_certificate /etc/letsencrypt/live/bi.asd-kontur.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.asd-kontur.ru/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;
    root /var/www/bi;
    autoindex off;

    location = /id {
        return 301 /id/;
    }

    location /id/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://id-track:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /id;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location = /levashovo/intake-control {
        return 301 /levashovo/intake-control/;
    }

    location /levashovo/intake-control/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://172.18.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /levashovo/intake-control;
        proxy_redirect ~^(/.*)$ /levashovo/intake-control$1;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }
}
