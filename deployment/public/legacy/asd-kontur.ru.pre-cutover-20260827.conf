server {
    listen 80;
    server_name asd-kontur.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name asd-kontur.ru;

    ssl_certificate /etc/letsencrypt/live/asd-kontur.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asd-kontur.ru/privkey.pem;

    # Экран поиска волны "Стажёры АИР" для Тимофея Калинина (isuid_app,
    # запущен на хосте, не в контейнере — доступен через docker-мост
    # kat_default, gateway 172.18.0.1, порт 8088 открыт для этой подсети
    # через UFW, наружу в интернет по-прежнему закрыт). Basic Auth сделан
    # на уровне самого FastAPI-приложения (Depends), не здесь — не дублируем.
    location /search-office {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staging/ {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Экран поиска PDF/DWG обеих волн (core.documents, is_current) — тот же
    # логин, что /search-office (require_search_office_auth). До 22.07 не был
    # покрыт ни одним location-блоком и фактически падал в catch-all на
    # backend:8000 (чужой сервис) — найдено и исправлено при разборе TTL/
    # семафора раздачи файлов.
    # Объединённый поиск (PDF+DWG+xlsx/docx, core.search_index) — с 02.08
    # заменяет /search-office и /search-docs (те теперь редиректят сюда на
    # уровне FastAPI, не здесь). Тот же логин (require_search_office_auth).
    location /kat-search {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /search {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /search-docs {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /documents/{id}/view — раздача файла для /search-docs (presigned-
    # редирект на S3, с 22.07 умеет нарезать сегмент из контейнера).
    location /documents/ {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Экран «Аудит» A.3/A.4 (сводка/реестр/карточка/очередь разбора/матрица) —
    # персональные учётки Basic Auth (oleg, timofey) на уровне FastAPI
    # (require_audit_auth), не здесь — verified_by в core.review_decisions
    # должен быть фактическим логином, поэтому не дублируем и не подменяем
    # авторизацию на nginx-уровне. Префиксное совпадение покрывает все
    # подпути (/audit/documents, /audit/doc/{id}, /audit/review, ...).
    location /audit {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Дашборд и очередь верификации (isuid_app: /, /review) — та же категория
    # бага, что уже была на /search-docs до 22.07: роуты добавлены в
    # isuid_app, но не получили своего location-блока здесь и падали в
    # catch-all на backend:8000 (не тот сервис, там их нет) — 404 на верхней
    # панели. Найдено и исправлено 06.08 при разборе жалобы «верхняя панель
    # не функциональна». location = / — точное совпадение (не префикс),
    # чтобы не перехватывать остальные location-блоки выше по неявному
    # префиксу.
    location = / {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /review {
        proxy_pass http://172.18.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
