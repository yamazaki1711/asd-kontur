[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asd-kontur"
version = "0.1.0"
description = "Common-core persistence and platform knowledge foundation for ASD-KONTUR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "Oleg Shcherbakov"}]
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi==25.1.0",
  "fastapi==0.139.2",
  "jsonschema>=4.25,<5",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.4",
  "pypdf>=6.0,<7",
  "python-multipart==0.0.32",
  "referencing>=0.36,<1",
  "rfc3339-validator>=0.1.4,<1",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn==0.52.4",
]

[project.scripts]
asd-kontur-spine = "asd_kontur.application_spine.runtime:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "licensecheck==2026.0.8",
  "mypy>=1.17,<2",
  "pip-audit==2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asd_kontur"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires an explicitly configured disposable PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/integration/test_platform_knowledge.py" = ["E501"]
"tests/integration/test_ai_vlm_harness.py" = ["E501"]
"tests/integration/test_common_domain_kernel.py" = ["E501"]
"tests/unit/test_ai_vlm_harness.py" = ["E501"]
"src/asd_kontur/kernel/postgres.py" = ["E501"]
"src/asd_kontur/support/generation.py" = ["E501"]
"src/asd_kontur/support/postgres.py" = ["E501"]
"src/asd_kontur/tender/postgres.py" = ["E501"]
"src/asd_kontur/application_spine/auth.py" = ["E501"]
"src/asd_kontur/application_spine/postgres.py" = ["E501"]
"tests/integration/test_tender_slice.py" = ["E501"]
"tests/integration/test_support_slice.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["asd_kontur"]

[[tool.mypy.overrides]]
module = ["rfc8785"]
ignore_missing_imports = true
