name: Core foundation quality

on:
  pull_request:
  push:
    branches:
      - main
      - implementation/g04-persistence-foundation-v0.1
      - implementation/g05-platform-knowledge-foundation-v0.1
      - implementation/g06-workspace-lifecycle-foundation-v0.1
      - implementation/g07-ai-vlm-harness-v0.1
      - implementation/wp11-common-domain-process-kernel-v0.1
      - implementation/wp12-tender-slice-v0.1
      - implementation/wp13-support-slice-v0.1
      - implementation/product-application-spine-v0.1

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.10.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Unit, contract, migration, and PostgreSQL integration tests
        env:
          ASD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest -ra

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate OpenAPI and typed client
        run: |
          uv run python tools/export_product_spine_openapi.py --output contracts/v2.1/openapi/product-spine-v1.json
          npm --prefix frontend run generate:api
          git diff --exit-code -- contracts/v2.1/openapi/product-spine-v1.json frontend/src/api/schema.ts

      - name: Frontend strict checks and production bundle
        working-directory: frontend
        run: |
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Install browser used by Product Spine E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Product Spine browser E2E
        working-directory: frontend
        env:
          ASD_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run e2e

      - name: Python dependency security and license checks
        run: |
          uv run pip-audit
          uv run licensecheck

      - name: Frontend dependency security and license inventory
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm ls --all --json > /tmp/asd-kontur-frontend-package-inventory.json

      - name: Whitespace check
        run: git diff --check

      - name: Reject secrets, project fixtures, and model artifacts
        run: |
          ! find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.safetensors' -o -name '*.gguf' \) -print | grep .
          ! rg -n 'TM.?35|Левашово|Игнатьево|BEGIN (RSA|OPENSSH|PRIVATE)' src tests contracts
